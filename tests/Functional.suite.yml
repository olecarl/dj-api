# Codeception Test Suite Configuration
#
# Suite for functional tests
# Emulate web requests and make application process them

actor: FunctionalTester
modules:
    enabled:
        - Asserts
        - Symfony:
            app_path: 'src'
            environment: 'test'
        - REST:
            depends: Symfony
        - Doctrine:
            depends: Symfony
            cleanup: true
gherkin:
    contexts:
        default:
            - App\Tests\Support\Step\Functional\UserProfileSteps
